openapi: 3.1.0
info:
  title: Wedding Missions API
  version: 0.2.0
  description: >
    HTTP API for the wedding missions app. All routes live under `/api` and are
    served by Next.js route handlers backed by Supabase Postgres
    (`lib/server/wedding-repository.js`).


    **Guest auth**: no email/password. A guest picks their name (`GET
    /api/guests`), then claims it with their room number (`POST
    /api/guests/{id}/claim`). On success the server issues a signed, httpOnly
    `guest_session` cookie; `GET /api/me` resumes a returning guest from it.
    Submitting (`POST /api/submissions`) and saving deck progress (`PUT
    /api/me/progress`) both require this cookie — there is no unverified path
    into either. A guest who skips verification ("continue as guest" in the
    UI) can browse but not submit.


    **Not yet implemented** (tracked separately): real photo/video upload
    (clients currently send a `pending-upload:<filename>` placeholder for
    `mediaUrl`) and the `/api/admin/*` backoffice (CSV import, moderation).
  license:
    name: UNLICENSED
servers:
  - url: /
    description: Same origin as the docs page
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: System
  - name: Missions
  - name: Guests
  - name: Session
  - name: Wall
  - name: Leaderboard

paths:
  /api/health:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: wedding-missions }

  /api/missions:
    get:
      tags: [Missions]
      summary: List active missions (the card deck)
      description: Ordered by `sort_order`, then `id`. Inactive missions are omitted.
      responses:
        "200":
          description: Active missions
          content:
            application/json:
              schema:
                type: object
                required: [missions]
                properties:
                  missions:
                    type: array
                    items: { $ref: "#/components/schemas/Mission" }

  /api/guests:
    get:
      tags: [Guests]
      summary: Search guests by name
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            Case-insensitive substring match on the guest's name. Omitted or
            empty returns the first 8 guests alphabetically. Always capped at 8.
      responses:
        "200":
          description: Matching guests
          content:
            application/json:
              schema:
                type: object
                required: [guests]
                properties:
                  guests:
                    type: array
                    items: { $ref: "#/components/schemas/Guest" }

  /api/guests/{id}:
    get:
      tags: [Guests]
      summary: Public guest lookup — record, score, and deck position
      description: >
        No auth required; used to show a guest's basic info before they've
        claimed their name. Does not require or imply a session.
      parameters:
        - $ref: "#/components/parameters/GuestId"
      responses:
        "200":
          description: Guest found
          content:
            application/json:
              schema:
                type: object
                required: [guest, score, progress]
                properties:
                  guest: { $ref: "#/components/schemas/GuestWithClaim" }
                  score: { $ref: "#/components/schemas/Score" }
                  progress: { $ref: "#/components/schemas/Progress" }
        "404":
          description: No guest with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/guests/{id}/claim:
    post:
      tags: [Session]
      summary: Verify a guest's room number and claim their name
      description: >
        Checks `roomNumber` against the guest's `room_number`. On success,
        sets the `guest_session` cookie (httpOnly, ~72h) and returns the same
        bootstrap shape as `GET /api/me`, so the client can enter the game
        immediately without a second request. Not device-locked — claiming
        from a second device with the correct room number issues it its own
        valid session.


        Throttled: 20 failed attempts locks the guest for 2 hours
        (`401` while guessing, `429` once locked).
      parameters:
        - $ref: "#/components/parameters/GuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomNumber]
              properties:
                roomNumber:
                  type: string
                  description: Matched case-insensitively, trimmed.
                  example: "214"
      responses:
        "200":
          description: Verified — session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: guest_session=...; HttpOnly; SameSite=Lax; Max-Age=259200
          content:
            application/json:
              schema:
                type: object
                required: [guest, score, progress]
                properties:
                  guest: { $ref: "#/components/schemas/GuestWithClaim" }
                  score: { $ref: "#/components/schemas/Score" }
                  progress: { $ref: "#/components/schemas/Progress" }
        "400":
          description: Missing roomNumber or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Room number doesn't match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No guest with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts — locked for 2 hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/me:
    get:
      tags: [Session]
      summary: Resume a returning, already-claimed guest
      description: Reads the guest_session cookie. Used on app load to skip straight to the game screen without re-verifying.
      security: [{ guestSession: [] }]
      responses:
        "200":
          description: Valid session
          content:
            application/json:
              schema:
                type: object
                required: [guest, score, progress]
                properties:
                  guest: { $ref: "#/components/schemas/GuestWithClaim" }
                  score: { $ref: "#/components/schemas/Score" }
                  progress: { $ref: "#/components/schemas/Progress" }
        "401":
          description: Missing, expired, forged, or invalidated session (e.g. after an admin claim reset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/me/progress:
    put:
      tags: [Session]
      summary: Save the current session's position in the mission deck
      security: [{ guestSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [missionIndex]
              properties:
                missionIndex:
                  type: integer
                  minimum: 0
                  description: Zero-based index into the mission deck.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Invalid JSON or missionIndex
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/me/logout:
    post:
      tags: [Session]
      summary: Clear the session cookie
      responses:
        "200":
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
              description: guest_session=; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /api/posts:
    get:
      tags: [Wall]
      summary: The wedding wall — approved submissions only
      description: >
        Returns at most 100 submissions with `status = 'approved'`, newest
        first. Pending and rejected submissions are never exposed here.
      responses:
        "200":
          description: Approved wall posts
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    items: { $ref: "#/components/schemas/WallPost" }

  /api/submissions:
    post:
      tags: [Wall]
      summary: Submit a mission answer
      description: >
        Requires a valid guest_session cookie — the guest id is taken from
        the session, never from the request body. Creates a submission with
        `status = 'pending'`. Points count toward the guest's total
        immediately (the leaderboard sums everything not rejected); an admin
        rejection later deducts them. `body` is required for `text` missions,
        `mediaUrl` for `photo` missions.
      security: [{ guestSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [missionId]
              properties:
                missionId: { type: integer }
                body:
                  type: [string, "null"]
                  description: Text answer. Trimmed; empty becomes null.
                mediaUrl:
                  type: [string, "null"]
                  description: >
                    URL of uploaded photo/video proof. Until the upload flow
                    lands (step 4) the client sends a `pending-upload:<filename>`
                    placeholder.
                mediaType:
                  type: [string, "null"]
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                type: object
                required: [submission, score]
                properties:
                  submission: { $ref: "#/components/schemas/SubmissionResult" }
                  score: { $ref: "#/components/schemas/Score" }
        "400":
          description: Invalid JSON, unknown or inactive mission, or missing content for the mission kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session — guest hasn't verified their name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected write failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Top 5 guests by points
      description: >
        Derived from the `guest_scores` view: `SUM(points)` over submissions
        where `status <> 'rejected'`. Guests with 0 points are excluded.
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                required: [leaders]
                properties:
                  leaders:
                    type: array
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }

components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: guest_session
      description: Signed, httpOnly cookie set by POST /api/guests/{id}/claim.

  parameters:
    GuestId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Guest id (slug for seeded guests, uuid for imported ones).

  schemas:
    Guest:
      type: object
      required: [id, name, table, relation, from]
      properties:
        id: { type: string, example: guest-alex }
        name: { type: string, example: Alex Tan }
        table: { type: [string, "null"], example: "Dahlia · 09" }
        relation: { type: [string, "null"], example: College friend }
        from:
          type: [string, "null"]
          description: Guest's hometown.
          example: Singapore

    GuestWithClaim:
      allOf:
        - $ref: "#/components/schemas/Guest"
        - type: object
          properties:
            claimedAt:
              type: [string, "null"]
              format: date-time
              description: When the guest verified their room number, or null if unclaimed.

    Mission:
      type: object
      required: [id, kicker, title, points, kind, color]
      properties:
        id: { type: integer, example: 1 }
        kicker: { type: string, example: Find your twin }
        title:
          type: string
          example: Take a photo with someone wearing the same colour as you.
        note:
          type: [string, "null"]
          example: The less coordinated, the better.
        points: { type: integer, example: 20 }
        kind: { type: string, enum: [photo, text] }
        color:
          type: string
          enum: [coral, butter, blue, sage, lilac, rose]

    WallPost:
      type: object
      required: [id, name, table, mission, body, tone, initials, points]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Sophie Lim }
        table: { type: [string, "null"], example: "Cosmos · 12" }
        mission:
          type: string
          description: The mission's kicker.
          example: Find your twin
        body: { type: string, example: "We absolutely did not plan this 🍒" }
        mediaUrl: { type: [string, "null"] }
        mediaType: { type: [string, "null"] }
        tone:
          type: string
          description: The mission's colour, used for card styling.
          example: coral
        initials: { type: string, example: SL }
        points: { type: integer, example: 20 }

    LeaderboardEntry:
      type: object
      required: [name, points, initials]
      properties:
        name: { type: string, example: Alex Tan }
        points: { type: integer, example: 40 }
        initials: { type: string, example: AT }

    Score:
      type: object
      required: [points, pendingCount, approvedCount]
      properties:
        points:
          type: integer
          description: SUM(points) over submissions where status <> 'rejected'.
          example: 40
        pendingCount: { type: integer, example: 1 }
        approvedCount: { type: integer, example: 1 }

    Progress:
      type: object
      required: [missionIndex]
      properties:
        missionIndex: { type: integer, example: 0 }

    SubmissionResult:
      type: object
      required: [id, missionId, points, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: integer, example: 2 }
        points: { type: integer, example: 10 }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Unknown mission }
        fields:
          type: array
          items: { type: string }
          description: Present on some validation errors.
